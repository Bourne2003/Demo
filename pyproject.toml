[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-utils"
version = "0.4.0"
description = "Small text and data utilities"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Bourne2003" }]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["demo_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
